<?xml version="1.0" encoding="UTF-8"?>
<!--
  OEPM SHOP · Sprite de iconos
  Trazo de 2px, caja de 24x24, color heredado con `currentColor`.
  En index.html este mismo sprite va incrustado (inline) para que la
  landing funcione también al abrirla con doble clic (protocolo file://),
  donde <use href="archivo.svg#id"> queda bloqueado por CORS.
  Si sirves el sitio por HTTP puedes usarlo así:
      <svg><use href="assets/icons/icons.svg#ico-check"></use></svg>
-->
