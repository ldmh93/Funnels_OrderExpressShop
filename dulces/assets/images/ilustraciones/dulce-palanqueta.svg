<?xml version="1.0" encoding="UTF-8"?>
<!-- OEM Shop · Palanqueta de cacahuate -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Palanqueta de cacahuate con caramelo">
  <defs>
    <radialGradient id="pa-bg" cx="34%" cy="24%" r="84%">
      <stop offset="0" stop-color="#FBF4ED"/><stop offset="1" stop-color="#E2C9B7"/>
    </radialGradient>
    <linearGradient id="pa-caramel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9A73E"/><stop offset="1" stop-color="#BF7415"/>
    </linearGradient>
    <linearGradient id="pa-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BF7415"/><stop offset="1" stop-color="#94540A"/>
    </linearGradient>
    <radialGradient id="pa-nut" cx="36%" cy="30%" r="76%">
      <stop offset="0" stop-color="#F6D08A"/><stop offset="1" stop-color="#D19233"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="152" fill="url(#pa-bg)"/>
  <ellipse cx="160" cy="250" rx="104" ry="20" fill="#262858" opacity=".13"/>

  <!-- Trozo recargado al fondo -->
  <g transform="rotate(28 232 128)">
    <rect x="188" y="94" width="94" height="62" rx="10" fill="url(#pa-edge)"/>
    <rect x="188" y="94" width="94" height="54" rx="10" fill="url(#pa-caramel)"/>
    <g fill="url(#pa-nut)" stroke="#A96C14" stroke-width="1.4">
      <ellipse cx="207" cy="112" rx="12" ry="9"/><ellipse cx="234" cy="106" rx="11" ry="8.5"/>
      <ellipse cx="261" cy="115" rx="12" ry="9"/><ellipse cx="216" cy="133" rx="11" ry="8.5"/>
      <ellipse cx="245" cy="130" rx="12" ry="9"/><ellipse cx="270" cy="136" rx="10" ry="8"/>
    </g>
  </g>

  <!-- Barra principal -->
  <g transform="rotate(-6 150 190)">
    <rect x="42" y="142" width="216" height="96" rx="14" fill="url(#pa-edge)"/>
    <rect x="42" y="142" width="216" height="82" rx="14" fill="url(#pa-caramel)"/>
    <!-- cacahuates -->
    <g fill="url(#pa-nut)" stroke="#A96C14" stroke-width="1.6">
      <ellipse cx="70" cy="164" rx="15" ry="11"/><ellipse cx="105" cy="157" rx="14" ry="10.5"/>
      <ellipse cx="140" cy="163" rx="15" ry="11"/><ellipse cx="176" cy="156" rx="14" ry="10.5"/>
      <ellipse cx="211" cy="163" rx="15" ry="11"/><ellipse cx="238" cy="172" rx="13" ry="10"/>
      <ellipse cx="60" cy="192" rx="13" ry="10"/><ellipse cx="93" cy="196" rx="15" ry="11"/>
      <ellipse cx="128" cy="190" rx="14" ry="10.5"/><ellipse cx="163" cy="197" rx="15" ry="11"/>
      <ellipse cx="199" cy="191" rx="14" ry="10.5"/><ellipse cx="232" cy="199" rx="13" ry="10"/>
    </g>
    <!-- surcos del cacahuate -->
    <g stroke="#B07A22" stroke-width="1.4" opacity=".6">
      <path d="M70 158v12M105 151v12M140 157v12M176 150v12M211 157v12M93 190v12M128 184v12M163 191v12M199 185v12"/>
    </g>
    <!-- brillo de caramelo -->
    <path d="M60 150c40-6 92-8 136-4" fill="none" stroke="#FFEAC0" stroke-width="6" stroke-linecap="round" opacity=".45"/>
  </g>
</svg>
