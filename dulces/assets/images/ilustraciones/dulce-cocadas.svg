<?xml version="1.0" encoding="UTF-8"?>
<!-- OEM Shop · Cocadas (dulce de coco horneado en capacillo) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Cocadas: dulce de coco horneado en capacillo">
  <defs>
    <radialGradient id="co-bg" cx="34%" cy="24%" r="84%">
      <stop offset="0" stop-color="#FBF4ED"/><stop offset="1" stop-color="#E2C9B7"/>
    </radialGradient>
    <linearGradient id="co-cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DF2440"/><stop offset="1" stop-color="#930F25"/>
    </linearGradient>
    <radialGradient id="co-dome" cx="34%" cy="20%" r="86%">
      <stop offset="0" stop-color="#FFF8EA"/><stop offset=".5" stop-color="#F4E2C4"/><stop offset="1" stop-color="#D3B489"/>
    </radialGradient>
    <radialGradient id="co-toast" cx="42%" cy="18%" r="78%">
      <stop offset="0" stop-color="#E5A249"/><stop offset="1" stop-color="#A85E1B"/>
    </radialGradient>
  </defs>

  <circle cx="160" cy="160" r="152" fill="url(#co-bg)"/>
  <ellipse cx="160" cy="252" rx="104" ry="20" fill="#262858" opacity=".13"/>

  <!-- ── Cocada pequeña al fondo ── -->
  <g opacity=".92">
    <path d="M222 200h74l-9 44a9 9 0 0 1-9 7h-38a9 9 0 0 1-9-7z" fill="#930F25"/>
    <g stroke="#6E0819" stroke-width="2" opacity=".45" stroke-linecap="round">
      <path d="M240 205l-4 44M259 205v45M278 205l4 44"/>
    </g>
    <path d="M222 202c-1-22 6-38 18-46 6-4 10-10 16-9 8 1 11 8 18 12 13 8 20 24 18 43z" fill="url(#co-dome)"/>
    <path d="M231 176c6-16 14-24 28-24s21 8 27 23c-8-8-17-12-27-12s-20 4-28 13z" fill="url(#co-toast)" opacity=".85"/>
    <g stroke="#FFF9EC" stroke-width="2.4" stroke-linecap="round" opacity=".8">
      <path d="M235 192h11M252 197h12M270 190h9"/>
    </g>
  </g>

  <!-- ── Capacillo rojo ── -->
  <path d="M56 196h150l-15 68a11 11 0 0 1-11 9H82a11 11 0 0 1-11-9z" fill="url(#co-cup)"/>
  <g stroke="#6E0819" stroke-width="2.6" opacity=".42" stroke-linecap="round">
    <path d="M88 202l-7 70M116 202l-4 71M145 202v71M174 202l4 71M199 202l7 69"/>
  </g>
  <path d="M56 196h150l-2.5 13H58.5z" fill="#F04C60" opacity=".5"/>

  <!-- ── Montículo de coco ── -->
  <path d="M57 198c-3-33 11-58 34-71 9-5 13-14 23-15 12-2 18 8 29 6 12-2 17-11 28-5 12 7 13 18 22 25 20 16 27 38 24 60z" fill="url(#co-dome)"/>
  <!-- costra dorada -->
  <path d="M72 152c9-24 22-38 40-43 8-2 12-9 21-9 10 0 15 7 24 8 10 1 15-6 23 0 10 7 12 16 19 23 8 8 13 15 16 24-13-19-38-31-71-31s-58 11-72 28z" fill="url(#co-toast)" opacity=".9"/>
  <path d="M92 126c13-13 27-19 44-19s31 6 44 19c-13-8-28-12-44-12s-31 4-44 12z" fill="#8A4A11" opacity=".45"/>
  <!-- hebras de coco -->
  <g stroke="#FFFBF0" stroke-width="3.2" stroke-linecap="round" opacity=".9">
    <path d="M78 178h18M104 190h22M138 182h20M170 172h16M92 164h14M156 196h18M120 168h13M186 190h12"/>
  </g>
  <g stroke="#C79A5E" stroke-width="2.4" stroke-linecap="round" opacity=".5">
    <path d="M86 186h14M128 194h16M164 184h14"/>
  </g>
  <!-- hebras sueltas en el borde -->
  <g stroke="#FFF6E4" stroke-width="3.4" stroke-linecap="round">
    <path d="M60 174l-9-3M64 158l-10-5M198 168l10-4M203 152l10-6M84 118l-7-8M180 116l8-8"/>
  </g>
  <path d="M82 140c9-16 21-25 36-28" fill="none" stroke="#FFF3D9" stroke-width="7" stroke-linecap="round" opacity=".5"/>
